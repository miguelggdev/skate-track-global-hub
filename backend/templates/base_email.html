<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:20px 0;">
    <tr><td align="center">
      <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;max-width:600px;width:100%;">
        <!-- Header -->
        <tr><td style="background-color:#1e3a5f;padding:24px 32px;">
          <h1 style="margin:0;color:#ffffff;font-size:20px;font-weight:700;">&#x1F6FC; SpeedSkateTrack Hub</h1>
          <p style="margin:4px 0 0;color:#94a3b8;font-size:13px;">Club de Patinaje de Velocidad</p>
        </td></tr>
        <!-- Content -->
        <tr><td style="padding:32px;">
          {% block content %}{% endblock %}
        </td></tr>
        <!-- Footer -->
        <tr><td style="background-color:#f8fafc;padding:16px 32px;border-top:1px solid #e2e8f0;">
          <p style="margin:0;color:#94a3b8;font-size:11px;text-align:center;">
            Este correo fue enviado a {{ recipient_email }}.<br>
            &copy; {{ year }} SpeedSkateTrack Hub &mdash; Todos los derechos reservados.
          </p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
