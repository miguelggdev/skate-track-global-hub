version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: earth-flow-hq-frontend:latest
    restart: unless-stopped
    networks:
      - supabase2_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=supabase2_net"
      - "traefik.http.routers.djauto-app.rule=Host(`djauto-app.arkanatech.tech`)"
      - "traefik.http.routers.djauto-app.entrypoints=websecure"
      - "traefik.http.routers.djauto-app.tls.certresolver=leresolver"
      # Si tienes el middleware de seguridad en este Traefik, puedes descomentarlo:
      # - "traefik.http.routers.djauto-app.middlewares=security-headers@file"
      - "traefik.http.services.djauto-app.loadbalancer.server.port=80"

networks:
  # Se conecta a la red externa que Traefik ya está usando
  supabase2_net:
    external: true
