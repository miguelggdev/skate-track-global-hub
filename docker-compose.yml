version: '3.9'

services:
  # ── Base de datos en memoria ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_in_production}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme_in_production}
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Backend (FastAPI) ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
    expose:
      - "8000"
    networks:
      - backend_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Celery Worker (automatizaciones) ────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped
    env_file: .env.production
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
    networks:
      - backend_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 2>/dev/null | grep -q pong || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Celery Beat (scheduler de tareas periódicas) ─────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A tasks.celery_app beat --loglevel=info --schedule=/var/celerybeat/celerybeat-schedule
    restart: unless-stopped
    env_file: .env.production
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
    volumes:
      - celerybeat_data:/var/celerybeat
    networks:
      - backend_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/celerybeat/celerybeat-schedule || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Flower (monitor visual de tareas Celery) ────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      celery -A tasks.celery_app flower
        --port=5555
        --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-changeme_in_production}
        --url_prefix=flower
    restart: unless-stopped
    env_file: .env.production
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
    expose:
      - "5555"
    networks:
      - backend_net
    depends_on:
      redis:
        condition: service_healthy

  # ── Nginx (frontend estático + proxy inverso API) ────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme_challenge:/var/www/certbot
    networks:
      - frontend_net
      - backend_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Certbot (renovación automática SSL) ─────────────────────────────────
  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_challenge:/var/www/certbot
    networks:
      - frontend_net
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  redis_data:
  letsencrypt:
  acme_challenge:
  celerybeat_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
