version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# SpeedSkateTrack Hub — Docker Compose (VPS + Traefik)
#
# Uso:
#   docker compose --env-file .env.production up -d --build
#
# Variables requeridas en .env.production → ver .env.production.example
# Red externa "supabase2_net" debe existir en el VPS (la crea Traefik al arrancar)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Frontend (Vite/React → Nginx + proxy /api/ al backend) ──────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked in at build time — no secrets, solo claves públicas de Supabase
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        # VITE_BACKEND_URL vacío → URLs relativas → nginx proxy /api/ internamente
        VITE_BACKEND_URL: ""
    image: skatetrack-frontend:latest
    restart: unless-stopped
    networks:
      - supabase2_net   # Traefik llega por aquí
      - app_net         # Habla con backend por aquí
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health.txt || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=supabase2_net"
      - "traefik.http.routers.skatetrack.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.skatetrack.entrypoints=websecure"
      - "traefik.http.routers.skatetrack.tls.certresolver=leresolver"
      - "traefik.http.services.skatetrack.loadbalancer.server.port=80"

  # ── Redis (broker Celery + cache) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI + LangGraph) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: skatetrack-backend:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    networks:
      - supabase2_net   # Traefik llega por aquí (API pública + webhooks Supabase)
      - app_net         # Habla con redis y con el frontend por aquí
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      # Backend expuesto en API_DOMAIN (stride.*) — endpoints protegidos por JWT
      # (agentes) y X-Webhook-Secret (webhooks). El frontend igual usa el proxy
      # interno /api/ (VITE_BACKEND_URL vacío); este router es para webhooks/API pública.
      - "traefik.enable=true"
      - "traefik.docker.network=supabase2_net"
      - "traefik.http.routers.skatetrack-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.skatetrack-api.entrypoints=websecure"
      - "traefik.http.routers.skatetrack-api.tls.certresolver=leresolver"
      - "traefik.http.services.skatetrack-api.loadbalancer.server.port=8000"

  # ── Celery Worker (ejecuta las 35 automatizaciones) ──────────────────────
  celery_worker:
    image: skatetrack-backend:latest
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped
    env_file: .env.production
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    networks:
      - app_net
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ── Celery Beat (scheduler de tareas periódicas) ─────────────────────────
  celery_beat:
    image: skatetrack-backend:latest
    command: celery -A tasks.celery_app beat --loglevel=info --schedule=/var/celerybeat/celerybeat-schedule
    restart: unless-stopped
    env_file: .env.production
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    volumes:
      - celerybeat_data:/var/celerybeat
    networks:
      - app_net
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ── Flower (monitor visual Celery — acceso restringido) ──────────────────
  flower:
    image: skatetrack-backend:latest
    command: >
      celery -A tasks.celery_app flower
        --port=5555
        --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
        --url_prefix=flower
    restart: unless-stopped
    env_file: .env.production
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    networks:
      - supabase2_net   # Traefik llega por aquí
      - app_net
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=supabase2_net"
      - "traefik.http.routers.skatetrack-flower.rule=Host(`${FLOWER_DOMAIN}`)"
      - "traefik.http.routers.skatetrack-flower.entrypoints=websecure"
      - "traefik.http.routers.skatetrack-flower.tls.certresolver=leresolver"
      - "traefik.http.services.skatetrack-flower.loadbalancer.server.port=5555"

volumes:
  redis_data:
  celerybeat_data:

networks:
  supabase2_net:
    external: true          # Red de Traefik — debe existir en el VPS
  app_net:
    driver: bridge          # Red interna — solo contenedores de esta app
