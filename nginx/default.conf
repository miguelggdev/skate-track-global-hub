# Configuración HTTPS definitiva.
# SUSTITUYE "tudominio.com" con tu dominio real.

# WebSocket / SSE: conmutar Connection header correctamente
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      keep-alive;
}

# Rate limiting — protege la API de agentes IA contra abuso de costos
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

server {
    listen 80;
    server_name tudominio.com www.tudominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name tudominio.com www.tudominio.com;

    # Certificados Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;

    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/tudominio.com/chain.pem;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Archivos frontend
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad (server-level)
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-Frame-Options           "DENY"                             always;
    add_header X-XSS-Protection          "1; mode=block"                    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self';" always;

    # SPA — todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con caché permanente (Vite genera hashes en los nombres)
    # Nginx no hereda add_header del server block cuando el location tiene sus propios add_header
    location /assets/ {
        expires 1y;
        add_header Cache-Control            "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options   "nosniff"                             always;
        add_header X-Frame-Options          "DENY"                                always;
    }

    # Service Worker sin caché
    location = /sw.js {
        expires -1;
        add_header Cache-Control          "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"                             always;
    }

    # Health check sin rate limit (usado por Docker healthcheck)
    location = /api/health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE de agentes IA — timeout extendido para respuestas largas del LLM
    location ~ ^/api/agents/[^/]+/chat/stream {
        limit_req zone=api_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 60s;
        proxy_buffering       off;
        proxy_cache           off;
        client_max_body_size  10m;
    }

    # Proxy inverso al backend FastAPI con rate limiting
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
        client_max_body_size  10m;
    }

    # Ocultar versión de Nginx
    server_tokens off;
}
