server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/x-javascript image/svg+xml
               application/wasm;
    gzip_min_length 1024;
    gzip_vary on;

    # Assets estaticos con cache larga (Vite genera hashes en nombres)
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|ico|webp|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health check para Docker healthcheck
    location = /health.txt {
        access_log off;
        add_header Content-Type text/plain;
    }

    # Proxy /api/ hacia FastAPI backend (contenedor "backend" en app_net)
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE - Server-Sent Events para streaming de agentes IA
        # Sin buffering para que los tokens lleguen en tiempo real al browser
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         3600s;
        proxy_send_timeout         3600s;
        proxy_connect_timeout      10s;
        proxy_set_header           Connection "";
        chunked_transfer_encoding  on;

        # Limite de body para subida de documentos al RAG
        client_max_body_size 50M;
    }

    # SPA fallback - todas las rutas van al index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
