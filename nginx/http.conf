# Configuración HTTP inicial — solo para obtener el certificado SSL con Certbot.
# SUSTITUYE "tudominio.com" con tu dominio real antes de usar este archivo.

server {
    listen 80;
    server_name tudominio.com www.tudominio.com;

    # Ruta de verificación de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Mientras no hay SSL, sirve el frontend normalmente
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
