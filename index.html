<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeedSkateTrack — Gestión inteligente para clubes de patinaje</title>
    <meta name="description" content="La plataforma que gestiona tu club de patinaje de velocidad. Atletas, cobros, entrenamientos y competencias — todo automatizado con IA." />
    <meta name="author" content="SpeedSkateTrack" />

    <meta property="og:title" content="SpeedSkateTrack — Gestión inteligente para clubes de patinaje" />
    <meta property="og:description" content="Ahorra 95 horas al mes. Gestiona atletas, cobros y competencias con IA. 30 días gratis." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SkateTrack" />
    <meta name="theme-color" content="#f97316" />

    <!-- GitHub Pages SPA routing fix -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location))
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
